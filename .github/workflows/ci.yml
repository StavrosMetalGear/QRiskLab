name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pybind11
          PYBIND11_CMAKE_DIR="$(python -m pybind11 --cmakedir)"
          echo "PYBIND11_CMAKE_DIR=${PYBIND11_CMAKE_DIR}"
          export pybind11_DIR="$PYBIND11_CMAKE_DIR"
          export CMAKE_PREFIX_PATH="$PYBIND11_CMAKE_DIR:${CMAKE_PREFIX_PATH:-}"
          pip install -e .

      - name: Smoke import package
        run: |
          python -c "import qrisklab; from qrisklab.finance import MonteCarlo; print('QRiskLab import OK')"

      - name: Run tests
        run: |
          pytest tests/ -v