[pytest]
# Pytest configuration for QRiskLab

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for API and dashboard
    slow: Tests that take significant time
    requires_bindings: Tests that require C++ bindings
    requires_quantum: Tests that require quantum backends
    requires_streamlit: Tests that require Streamlit

# Coverage options
[coverage:run]
source = qrisklab
omit = 
    */tests/*
    */site-packages/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
